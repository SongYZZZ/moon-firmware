name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hustcer/setup-moonbit@v1.22
      - run: moon version --all
      - run: moon fmt --check
      - run: moon update
      - run: moon check
      - run: moon test
      - run: moon build
      - run: moon run cmd/moon-firmware -- inspect tests/fixtures/basic.hex
      - run: moon run cmd/moon-firmware -- verify tests/fixtures/basic.hex
      - run: moon run cmd/moon-firmware -- gate tests/fixtures/cortex_m_release.hex --flash-start 0x08000000 --flash-end 0x0800FFFF --ram-start 0x20000000 --ram-end 0x2000FFFF --page-size 0x400
